schema_version = 1

[repository]
name = "ngkit"
owner = "rn-forge"
archetype = "node-lib"

[kiln]
ref = "feature/v1"

[docs]
profile = "mkdocs"

[ci]
# kiln renders node_modules, dist, stories, .storybook and .venv itself.
sonar_exclusions = ["apps/ng-demo-api/**", "apps/ng-demo-api-fastapi/**"]
# Build-time tooling is exercised by the pack pipeline; app wiring and
# environments by the Playwright suite, which reports no unit coverage.
sonar_coverage_exclusions = [
  "tools/scripts/patch-package-exports.mjs",
  "apps/*-e2e/**",
  "apps/*/src/environments/**",
  "apps/*/src/app/app.config.ts",
]
