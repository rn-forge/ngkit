allowBuilds:
  '@compodoc/compodoc': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # picomatch (high, no patched release) via @angular/localize > tinyglobby, Angular's
    # localize build tooling, not the browser bundle. Remove when a fix ships: E12 F12.12.
    - GHSA-fc5q-39xc-vjpf
autoInstallPeers: true
packages:
  - 'apps/**'
  - 'libs/**'
  - 'tools/**'
  # exclude packages that are inside test directories
  - '!**/test/**'
overrides:
  # GHSA-g3hv-75wg-m249: minimatch < 11.0.1 on the 10.x line (dev-only, through eslint, ts-morph and verdaccio).
  'minimatch@10': ^11.0.1
