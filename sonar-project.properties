# See https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters
# TODO: confirm projectKey/organization match SonarCloud project settings
# (Project > Administration > General Settings > Analysis Method > CI-based)
sonar.projectKey=rn-forge_ngkit
sonar.organization=rn-forge

sonar.sources=libs,apps
sonar.tests=libs,apps
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.stories.ts,**/.storybook/**,**/.venv/**,apps/ng-demo-api/**,apps/ng-demo-api-fastapi/**
# Build-time tooling only (invoked once by the `pack` pipeline, never shipped); not
# covered by any test target and not worth mocking node:fs for. See CLAUDE.md.
# App wiring, build-time environments and the e2e project's config are exercised
# by the Playwright suite, which reports no unit coverage.
sonar.coverage.exclusions=libs/ng-bootstrap/scripts/**,apps/ng-demo-e2e/**,apps/*/src/environments/**,apps/*/src/app/app.config.ts
