<rnf-header [options]="headerOptions" />

<div class="d-flex justify-content-end px-3 py-2">
  <rnf-user-menu profileUrl="/user/profile" settingsUrl="/user/settings" />
</div>

<main class="container-fluid mb-auto">
  <rnf-session-expiry-notice />
  <router-outlet />
</main>

<rnf-footer [options]="footerOptions" />

<rnf-modal
  #helpModal
  [options]="helpModalOptions"
  [bodyTemplate]="helpModalTemplate" />
<ng-template #helpModalTemplate>
  <p>This is the RN Forge Demo application.</p>
</ng-template>

<rnf-color-mode class="position-fixed" style="bottom: 4em; right: 1em" />
