name: Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      exact-version:
        description: 'Exact version (overrides bump; leave empty normally)'
        required: false
        type: string
      dist-tag:
        description: 'npm dist-tag (latest for current releases; v<major>-lts for hotfixes to older majors)'
        required: true
        type: string
        default: 'latest'
      dry-run:
        description: 'Dry run (no commit/tag/publish)'
        required: true
        type: boolean
        default: true
      first-release:
        description: 'First release ever (no existing git tags)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # push release commit + tags, create GitHub Releases
  id-token: write # npm OIDC trusted publishing
  actions: read # read ci.yml runs for the gate

concurrency:
  group: release
  cancel-in-progress: false # never cancel a running release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history required for git-tag version resolution
          filter: tree:0

      # npm >= 11.5.1 is required for OIDC publishing (Node 24 from .nvmrc)
      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      # A release commit is pushed with GITHUB_TOKEN, which starts no workflow,
      # so a resumed release gates on the commit it was cut from (HEAD^).
      - name: Gate on a green CI run
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            sha=$(git rev-parse HEAD^)
          else
            sha=$(git rev-parse HEAD)
          fi
          count=$(gh run list --workflow ci.yml --commit "$sha" --status success --json databaseId --jq length)
          if [ "$count" -ge 1 ]; then
            echo "Found a successful ci.yml run for $sha"
            exit 0
          fi
          msg="No successful ci.yml run for $sha"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::$msg"
          else
            echo "::error::$msg"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}

      # The checkout fetched tags from origin, so a tag at HEAD is a pushed tag.
      # A version counts as shipped only when its GitHub Release is published.
      - name: Detect release state
        id: state
        run: |
          tag=$(git tag --points-at HEAD --list 'v*')
          if [ -z "$tag" ]; then
            mode=new
          elif [ "$(wc -l <<<"$tag")" -ne 1 ]; then
            echo "::error::More than one v* tag at HEAD: $tag"
            exit 1
          elif [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            mode=released
          else
            mode=resume
          fi
          echo "::notice::Release mode: $mode${tag:+ ($tag)}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Commits and tags locally only; nothing is pushed until the checks pass.
      # Publishing is excluded (--skip-publish) because the combined command
      # cannot pass a custom npm dist-tag; the Publish step below does that.
      - name: Version locally
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'new' }}
        run: |
          args=(release "$VERSION_SPEC" --skip-publish)
          if [ "$FIRST_RELEASE" = "true" ]; then args+=(--first-release); fi
          pnpm exec nx "${args[@]}"
        env:
          VERSION_SPEC: ${{ inputs.exact-version != '' && inputs.exact-version || inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first-release }}

      # In resume and released modes HEAD already carries the tag, so this resolves it too.
      - name: Resolve release tag
        if: ${{ !inputs.dry-run }}
        id: tag
        run: |
          tags=$(git tag --points-at HEAD --list 'v*')
          if [ -z "$tags" ] || [ "$(wc -l <<<"$tags")" -ne 1 ]; then
            echo "::error::Expected exactly one v* tag at HEAD, found: ${tags:-none}"
            exit 1
          fi
          echo "name=$tags" >> "$GITHUB_OUTPUT"

      # Dry runs deliberately do NOT use the combined `nx release` command
      # as it does not write files when dry-run flag is present.
      # so dist manifests still carry workspace:* references that pnpm publish rejects
      - name: Version (dry-run simulation)
        if: ${{ inputs.dry-run }}
        run: |
          args=(release version "$VERSION_SPEC" --git-commit=false --git-tag=false --stage-changes=false)
          if [ "$FIRST_RELEASE" = "true" ]; then args+=(--first-release); fi
          pnpm exec nx "${args[@]}"
        env:
          VERSION_SPEC: ${{ inputs.exact-version != '' && inputs.exact-version || inputs.specifier }}
          FIRST_RELEASE: ${{ inputs.first-release }}

      # Both version paths rewrite workspace:* peer deps to exact pins in the dist
      # manifest roots. --excludeTaskDependencies packs the versioned dist/ rather
      # than rebuilding it.
      - name: Verify
        if: ${{ inputs.dry-run || steps.state.outputs.mode == 'new' }}
        run: |
          pnpm exec nx run-many -t pack -p tag:publishable --excludeTaskDependencies
          pnpm exec nx run-many -t verify-dist -p tag:publishable --excludeTaskDependencies
          pnpm exec nx run-many -t verify-consumer -p tag:publishable --excludeTaskDependencies

      # Resume: preVersionCommand does not run, so dist/ is rebuilt from the tagged
      # source (with task dependencies) and pack stamps the exact internal pins.
      - name: Rebuild and verify (resume)
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'resume' }}
        run: pnpm exec nx run-many -t pack verify-dist verify-consumer -p tag:publishable

      - name: Push release commit and tag
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'new' }}
        run: git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG"
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run && steps.state.outputs.mode != 'released' }}
        run: |
          tag="$TAG"
          # Only a draft can reach this step (published means released mode); keeps the tag.
          if gh release view "$tag" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          node tools/ci/release-notes.mjs "${tag#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/tarballs/*.tgz --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          TAG: ${{ steps.tag.outputs.name }}
          GH_TOKEN: ${{ github.token }}

      # --excludeTaskDependencies to not invalidate cache and use already prepped version in dist/
      # step's preVersionCommand.
      - name: Publish
        if: ${{ inputs.dry-run || steps.state.outputs.mode != 'released' }}
        run: >
          pnpm exec nx release publish
          --tag="$DIST_TAG"
          --excludeTaskDependencies
          ${{ inputs.dry-run && '--dry-run' || '' }}
          ${{ inputs.first-release && '--first-release' || '' }}
        env:
          DIST_TAG: ${{ inputs.dist-tag }}

      # Rolling pointer so consumers can depend on a stable, version-less URL
      # (.../releases/download/latest/<pkg>.tgz) instead of tracking exact tags.
      # Only moves on main - hotfix releases from release/** branches keep their
      # own versioned tag/release but don't touch the main-line "latest" pointer.
      - name: Update rolling "latest" release
        if: ${{ !inputs.dry-run && github.ref_name == 'main' }}
        run: |
          # Skip when the remote "latest" tag already sits on this tag's commit and
          # the release carries the same assets. (targetCommitish is a branch name,
          # so the tag's ref is what records the commit.)
          list='[.assets[].name] | sort | join(",")'
          want=$(git rev-parse "$TAG^{commit}")
          refs=$(git ls-remote origin refs/tags/latest 'refs/tags/latest^{}')
          have=$(echo "$refs" | awk '/\^\{\}$/ {p=$1} {l=$1} END {print p ? p : l}')
          if [ "$have" = "$want" ] &&
            [ "$(gh release view latest --json assets --jq "$list")" = "$(gh release view "$TAG" --json assets --jq "$list")" ]; then
            echo "::notice::latest already points at $TAG"
            exit 0
          fi
          # Released mode has no local tarballs; fetch them from the published release.
          if ! compgen -G 'dist/tarballs/*.tgz' >/dev/null; then
            gh release download "$TAG" --dir dist/tarballs --pattern '*.tgz'
          fi
          gh release delete latest --yes --cleanup-tag || true
          git tag -f latest
          git push origin latest --force
          gh release create latest dist/tarballs/*.tgz --title "Latest" --notes "Rolling pointer to $TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}

      - name: Already released
        if: ${{ !inputs.dry-run && steps.state.outputs.mode == 'released' }}
        run: echo "::notice::$TAG is already released"
        env:
          TAG: ${{ steps.tag.outputs.name }}

  # Installs what consumers download, not what the release runner built.
  published-install:
    needs: release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: ./.github/actions/setup

      - name: Verify the released tarballs
        run: |
          gh release download "$TAG" --dir dist/tarballs --pattern '*.tgz'
          pnpm exec nx run-many -t verify-consumer --excludeTaskDependencies
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
