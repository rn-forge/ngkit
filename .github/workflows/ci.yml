name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch: # Enable manual trigger
    inputs:
      use-nx-cloud:
        description: 'Use Nx Cloud distributed CI (uncheck to validate locally, e.g. if Nx Cloud is having issues)'
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Default path: distributes lint/test/build/e2e across Nx Cloud agents (.nx/workflows/agents.yaml)
  # This job excludes playwright as they are managed by Nx Cloud agents
  ci-cloud:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use-nx-cloud) || (github.event_name != 'workflow_dispatch' && vars.USE_NX_CLOUD != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          start-ci-run: '--distribute-on="3 rn-forge-ng" --stop-agents-after="lint,test,build,e2e-ci"'

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      - run: pnpm exec nx affected -t lint test build e2e-ci

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()

  # Fallback path to run the pipeline on github runner when Nx Cloud is not available
  # Enable by setting repo variable USE_NX_CLOUD=false, or with "use-nx-cloud" unchecked when runnning manually
  ci-local:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use-nx-cloud == false) || (github.event_name != 'workflow_dispatch' && vars.USE_NX_CLOUD == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Browsers are only needed when some project has an e2e target
      - name: Detect e2e projects
        id: e2e
        run: echo "has-e2e=$(pnpm exec nx show projects --with-target e2e --json | jq 'length > 0')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.e2e.outputs.has-e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps
        if: steps.e2e.outputs.has-e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps
        if: steps.e2e.outputs.has-e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      - run: pnpm exec nx affected -t lint test build e2e

  # Runs regardless of which path above executed - Sonar needs full (not
  # affected-only) coverage, so it regenerates lcov reports itself rather
  # than reusing whatever ci-cloud/ci-local happened to run.
  # Skipped for Dependabot PRs and fork PRs: GitHub sandboxes both (read-only
  # GITHUB_TOKEN, no Actions secrets), so SONAR_TOKEN isn't available there -
  # the next push to main still scans the merged code.
  sonar:
    needs: [ci-cloud, ci-local]
    if: ${{ always() && github.actor != 'dependabot[bot]' && (needs.ci-cloud.result == 'success' || needs.ci-local.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history, not a shallow clone

      - uses: ./.github/actions/setup

      - name: Generate coverage reports
        run: pnpm exec nx run-many -t test

      # Coverage is discovered, not listed: every project's test target writes
      # coverage/<project>/lcov.info.
      - name: Discover lcov reports
        id: lcov
        run: |
          reports=$(find coverage -name lcov.info | sort | paste -sd, -)
          if [ -z "$reports" ]; then
            echo "::error::No lcov.info found under coverage/"
            exit 1
          fi
          echo "reports=$reports" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          # Without qualitygate.wait the job passes on submitting the analysis,
          # so a failed quality gate would never fail CI.
          args: >
            -Dsonar.javascript.lcov.reportPaths=${{ steps.lcov.outputs.reports }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs regardless of which path above executed - packaging isn't a
  # validation step, it just needs one of them to have succeeded first.
  package:
    needs: [ci-cloud, ci-local]
    if: ${{ always() && (needs.ci-cloud.result == 'success' || needs.ci-local.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Plain `nx pack` (unlike the release path) never stamps workspace:*
      # peers to exact pins, so verify-dist checks the CI tarballs' manifests.
      - name: Pack and verify publishable tarballs
        run: pnpm exec nx run-many -t pack verify-dist verify-consumer

      - name: Upload package tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarballs
          path: dist/tarballs/*.tgz
          retention-days: 14

  # The one check branch protection requires. Skipped jobs (Sonar on
  # Dependabot/fork PRs, the unused ci-* path) pass; a failed or cancelled
  # job, or neither ci-* path succeeding, fails it.
  ci-ok:
    needs: [ci-cloud, ci-local, sonar, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result | IN("failure", "cancelled")) | .key' <<<"$NEEDS" | paste -sd, -)
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi
          if ! jq -e '[.["ci-cloud"].result, .["ci-local"].result] | index("success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::Neither ci-cloud nor ci-local succeeded"
            exit 1
          fi
