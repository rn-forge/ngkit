# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → test-cloud or test-local → sonar, smoke, docs → ci-ok.
#
# test-cloud:  `nx affected` distributed over Nx Cloud agents (.nx/workflows/agents.yaml).
# test-local:  the same on the runner, unless `USE_NX_CLOUD` is `true` or dispatch checks it.
#
# Every step goes through `task`; `kiln doctor`'s ci-entrypoint rule fails the
# build if a step invokes uv/mkdocs/pnpm/npx/nx/ng/kiln directly. kiln runs
# here only as the version `[kiln] ref` pins, read-only, through
# `task validate`: it checks the tree against the committed
# .rn-forge/kiln/state.json and never runs `kiln apply`.
#
# The repeated toolchain setup lives in .github/actions/setup, committed beside
# this file. Each job checks out first: GitHub can only run a local action from
# the checked-out tree. Every `uses:` is pinned to a commit SHA with the version
# in a trailing comment. Pins move in kiln (cicd/pins.toml), not here; Dependabot
# (.github/dependabot.yml, also generated) watches only the repository's own
# actions and its uv dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use-nx-cloud:
        description: 'Use Nx Cloud distributed CI (leave unchecked to validate on a GitHub runner)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI resolves the committed lock and never rewrites it. Without this a stale
  # uv.lock passes CI against a resolution nobody committed.
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      # The Nx projects are checked by test-cloud or test-local; this job runs the rest.
      - name: Validate
        run: task ci:validate
        env:
          KILN_DOCTOR_FULL: ${{ ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch') && '1' || '' }}

  # Fails a pull request that adds a dependency with a known vulnerability, from
  # GitHub's dependency graph. Skipped on a push, which `ci-ok` treats as a pass.
  dependency-review:
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Scans the full git history for leaked secrets (gitleaks, `task ci:secret-scan`). A pull
  # request from a fork cannot be scanned with this checkout, so it is skipped, which
  # `checks-ok` treats as a pass.
  secret-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the history for secrets
        run: task ci:secret-scan

  # Distributes lint/test/build/e2e across Nx Cloud agents (.nx/workflows/agents.yaml) when USE_NX_CLOUD=true.
  # This job excludes playwright as they are managed by Nx Cloud agents
  test-cloud:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use-nx-cloud) || (github.event_name != 'workflow_dispatch' && vars.USE_NX_CLOUD == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-ci-run: >-
            --distribute-on="${{ vars.NX_CLOUD_AGENTS || '3' }} linux-medium" --stop-agents-after="lint,test,build,e2e-ci"

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - run: task ci:test -- lint test build e2e-ci

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()

  # The default path: the pipeline on a GitHub runner, for a repository not on Nx Cloud.
  test-local:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use-nx-cloud == false) || (github.event_name != 'workflow_dispatch' && vars.USE_NX_CLOUD != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Browsers are only needed when some project has an e2e target
      - name: Detect e2e projects
        id: e2e
        run: task ci:test:has-e2e >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.e2e.outputs.has-e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: task ci:test:playwright
        if: steps.e2e.outputs.has-e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: task ci:test:playwright-deps
        if: steps.e2e.outputs.has-e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - run: task ci:test -- lint test build e2e

  # Scans one tree, so it runs after either path. Skipped for Dependabot and fork
  # pull requests: GitHub sandboxes both (no Actions secrets), so SONAR_TOKEN is
  # not available there; the next push to main still scans the merged code.
  sonar:
    needs: [validate, test-cloud, test-local, smoke]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_sonar.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs regardless of which path above executed - the tarball smoke test isn't a
  # validation step, it just needs one of them to have succeeded first.
  smoke:
    needs: [validate, test-cloud, test-local]
    if: ${{ always() && (needs.test-cloud.result == 'success' || needs.test-local.result == 'success') }}
    permissions:
      contents: read
    uses: ./.github/workflows/_smoke.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  # The version is bumped in a pull request (`task version -- <bump>`); this job
  # tags it, publishes it, and never commits. Only a push to the default branch,
  # after `checks-ok`, gets here.
  release:
    needs: [checks-ok]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # create GitHub Releases
      id-token: write # npm OIDC trusted publishing
    uses: ./.github/workflows/_release.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Installs what consumers download, not what the release runner built.
  verify-release:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_verify-release.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Publishes the one Pages site from main after the checks pass: MkDocs, with
  # Compodoc and Storybook assembled under it. deploy-pages replaces the whole
  # site, so every deploy builds all three.
  docs:
    needs: [checks-ok, release, verify-release]
    if: ${{ !cancelled() && needs.checks-ok.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref_name == 'main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_docs.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form

  # Everything that runs before a release, as one job: `release` and `docs` wait
  # for it, not for a list of checks. A skipped job (the fork-guarded scan, a
  # release or deploy on a pull request) passes; a failed or cancelled one does not.
  checks-ok:
    needs: [validate, dependency-review, test-cloud, test-local, smoke, sonar, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The only check branch protection requires. Job and matrix names change as
  # the repo grows; this one does not. It adds what runs after the barrier.
  ci-ok:
    needs: [checks-ok, release, verify-release, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
