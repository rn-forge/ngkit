# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: Smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Runs regardless of which path above executed - the tarball smoke test isn't a
  # validation step, it just needs one of them to have succeeded first.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Plain `nx pack` (unlike the release path) never stamps workspace:*
      # peers to exact pins, so verify-dist checks the CI tarballs' manifests.
      - name: Pack and verify publishable tarballs
        run: task ci:smoke

      - name: Upload package tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarballs
          path: dist/tarballs/*.tgz
          retention-days: 14
