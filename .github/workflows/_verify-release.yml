# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: Verify release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag the release published
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Installs what consumers download, not what the release runner built.
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the released tarballs
        run: task ci:verify-release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
