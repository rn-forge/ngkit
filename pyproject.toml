[project]
name = "ngkit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.pyright]
reportMissingTypeStubs = false
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN", "D", "PLR2004", "S101"]

[tool.uv]
no-sources = true

[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "google-yamlfmt>=0.21.0",
    "import-linter>=2.15",
    "pip-audit>=2.10",
    "pip-licenses>=5",
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "taplo>=0.9",
    "zizmor>=1.31",
]
docs = [
    "mdformat>=1.0.0",
    "mdformat-front-matters>=2.0.0",
    "mdformat-gfm>=0.4",
    "mdformat-mkdocs>=5.3.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]
